<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Version Selector</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #121212;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .menu {
    background-color: #1e1e1e;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    min-width: 300px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    transition: all 0.3s ease;
  }

  h2 {
    margin-bottom: 20px;
  }

  button {
    background-color: #2c2c2c;
    color: #fff;
    border: none;
    padding: 12px 20px;
    margin: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s ease;
  }

  button:hover {
    background-color: #444;
    transform: scale(1.05);
  }

  .hidden {
    display: none;
  }

  .note {
    font-size: 14px;
    color: #aaa;
    margin-top: 10px;
  }

  .fade-in {
    animation: fadeIn 0.5s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .multiplayer {
    font-size: 13px;
    color: #ccc;
    margin-top: 10px;
  }

  .multiplayer a {
    color: #61dafb;
    text-decoration: none;
  }
  .multiplayer a:hover {
    text-decoration: underline;
  }

  .settings-img {
    margin-top: 5px;
    max-width:300px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }
</style>
</head>
<body>

<div class="menu" id="menu">
  <h2>Select Type</h2>
  <div id="type-selection">
    <button onclick="chooseType('WASM')">WASM</button>
    <button onclick="chooseType('JAVA')">JAVA</button>
    <div class="note">JAVA 1.8.8 Recommended</div>
    <div class="note">Make GUI Scale Whatever</div>
    <div class="multiplayer">Multiplayer: <a href="wss://join.iwishyouamerrynewyear.com">ws://join.iwishyouamerrynewyear.com</a></div>
    <img src="settings.png" alt="Settings" class="settings-img">
  </div>

  <div id="version-selection" class="hidden">
    <h2>Select Version</h2>
    <div>
      <button onclick="chooseVersion('1.8.8')">1.8.8</button>
    </div>
    <div>
      <button onclick="chooseVersion('1.12.2')">1.12.2</button>
    </div>
    <div>
      <button onclick="goBack()">Back</button>
    </div>
  </div>
</div>

<script>
  let selectedType = '';

  function chooseType(type) {
    selectedType = type;
    document.getElementById('type-selection').classList.add('hidden');
    document.getElementById('version-selection').classList.remove('hidden');
    document.getElementById('version-selection').classList.add('fade-in');
  }

  function chooseVersion(version) {
    const path = `${selectedType}/${version}.html`;
    window.location.href = path;
  }

  function goBack() {
    document.getElementById('version-selection').classList.add('hidden');
    document.getElementById('type-selection').classList.remove('hidden');
  }
</script>

</body>
</html>
